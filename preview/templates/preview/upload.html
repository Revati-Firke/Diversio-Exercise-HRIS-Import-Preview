<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRIS Import Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    p.subtitle { color: #555; margin-top: 0; }
    form { margin-top: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input[type="file"] { display: block; margin-bottom: 1rem; }
    button { padding: 0.5rem 1.5rem; font-size: 1rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>HRIS Import Preview</h1>
  <p class="subtitle">Upload an HRIS CSV to inspect its contents before import.</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="{% url 'preview:analyze' %}" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="csv_file">Select CSV file</label>
    <input type="file" id="csv_file" name="csv_file" accept=".csv">
    <button type="submit">Preview Import</button>
  </form>
</body>
</html>
